[package]
name = "job-harness-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP and local dashboard adapters for Job Harness"
publish = false

[dependencies]
harness-core = { package = "job-harness-core", path = "../harness-core" }
anyhow = "1"
serde_json = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "multipart"] }
subtle = "2.6"
notify = "8.2"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
