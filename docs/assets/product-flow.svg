<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" width="960" height="272" role="img" aria-label="Job Harness four-stage lifecycle: Discover and vet, Freeze packet and brief, Review and send, Track outcomes">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace; }
    </style>
  </defs>

  <!-- Flat matte dark architectural surface, 1px hairline border -->
  <rect x="0.5" y="0.5" width="959" height="271" rx="8" fill="#0d0e11" stroke="#23242b" stroke-width="1"/>

  <!-- Top header bar -->
  <text x="28" y="34" class="sans" font-size="13" font-weight="600" fill="#f1f1f4" letter-spacing="-0.01em">Lifecycle of one role</text>
  <text x="932" y="34" text-anchor="end" class="mono" font-size="11" fill="#6f717a">LOCAL MARKDOWN + SQLITE · ZERO CLOUD LOCK-IN</text>
  <line x1="28" y1="50" x2="932" y2="50" stroke="#1e2027" stroke-width="1"/>

  <!-- Column 1 -->
  <text x="28" y="78" class="mono" font-size="11" fill="#7c7e88">01</text>
  <text x="28" y="102" class="sans" font-size="14" font-weight="600" fill="#f1f1f4">Scout &amp; vet</text>
  <text x="28" y="124" class="sans" font-size="12" fill="#9a9ca6">Checks employer boards,</text>
  <text x="28" y="141" class="sans" font-size="12" fill="#9a9ca6">filters salary, location, and</text>
  <text x="28" y="158" class="sans" font-size="12" fill="#9a9ca6">your avoid list before saving.</text>
  <text x="28" y="196" class="mono" font-size="10.5" fill="#6f717a">dedupes by company + url</text>

  <!-- Vertical divider 1 -->
  <line x1="252" y1="64" x2="252" y2="206" stroke="#1e2027" stroke-width="1"/>

  <!-- Column 2 -->
  <text x="274" y="78" class="mono" font-size="11" fill="#7c7e88">02</text>
  <text x="274" y="102" class="sans" font-size="14" font-weight="600" fill="#f1f1f4">Freeze &amp; prep</text>
  <text x="274" y="124" class="sans" font-size="12" fill="#9a9ca6">Matches your verified CV</text>
  <text x="274" y="141" class="sans" font-size="12" fill="#9a9ca6">track, reuses saved answers,</text>
  <text x="274" y="158" class="sans" font-size="12" fill="#9a9ca6">and writes a 2-layer brief.</text>
  <text x="274" y="196" class="mono" font-size="10.5" fill="#6f717a">immutable sha256 packet</text>

  <!-- Vertical divider 2 -->
  <line x1="484" y1="64" x2="484" y2="206" stroke="#1e2027" stroke-width="1"/>

  <!-- Column 3 (verified boundary — single quiet emerald accent) -->
  <text x="506" y="78" class="mono" font-size="11" fill="#34d399">03 · SAFETY GATE</text>
  <text x="506" y="102" class="sans" font-size="14" font-weight="600" fill="#f1f1f4">Review &amp; submit</text>
  <text x="506" y="124" class="sans" font-size="12" fill="#9a9ca6">Drafts replies in your voice</text>
  <text x="506" y="141" class="sans" font-size="12" fill="#9a9ca6">and enforces daily caps and</text>
  <text x="506" y="158" class="sans" font-size="12" fill="#9a9ca6">your chosen delegation mode.</text>
  <text x="506" y="196" class="mono" font-size="10.5" fill="#34d399">blocks duplicate retries</text>

  <!-- Vertical divider 3 -->
  <line x1="716" y1="64" x2="716" y2="206" stroke="#1e2027" stroke-width="1"/>

  <!-- Column 4 -->
  <text x="738" y="78" class="mono" font-size="11" fill="#7c7e88">04</text>
  <text x="738" y="102" class="sans" font-size="14" font-weight="600" fill="#f1f1f4">Track honestly</text>
  <text x="738" y="124" class="sans" font-size="12" fill="#9a9ca6">Follows every stage in Kanban</text>
  <text x="738" y="141" class="sans" font-size="12" fill="#9a9ca6">or Sankey — keeping silence,</text>
  <text x="738" y="158" class="sans" font-size="12" fill="#9a9ca6">rejections, &amp; withdrawals clear.</text>
  <text x="738" y="196" class="mono" font-size="10.5" fill="#6f717a">applications/*.md → pipeline</text>

  <!-- Bottom hairline strip (plain typographic metadata, no pill box, no rainbow dots) -->
  <line x1="28" y1="224" x2="932" y2="224" stroke="#1e2027" stroke-width="1"/>
  <text x="28" y="249" class="sans" font-size="11.5" fill="#8b8d98">
    <tspan fill="#d4d4dc" font-weight="500">Any agent:</tspan> Hermes, Claude Code, Codex, Pi, Cursor, or local models
  </text>
  <text x="932" y="249" text-anchor="end" class="sans" font-size="11.5" fill="#8b8d98">
    <tspan fill="#d4d4dc" font-weight="500">Zero secrets in workspace:</tspan> 1-use self-destructing handoff
  </text>
</svg>
