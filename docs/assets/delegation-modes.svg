<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Job Harness delegation modes: Drafts only, Assisted (recommended), and Autonomous, above an always-human boundary">
  <defs>
    <style>
      .bg { fill: #0d0e12; }
      .card { fill: #15171e; stroke: #272a36; stroke-width: 1.25; }
      .card-rec { fill: #141c1b; stroke: #2f8567; stroke-width: 1.6; }
      .bar-safe { fill: #1a1826; stroke: #4c4276; stroke-width: 1.25; }
      .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #f3f4f8; }
      .subtitle { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #9ba1b4; }
      .body { font: 400 12px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #c6cbd9; }
      .muted { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #8b91a5; }
      .badge-rec { font: 600 10.5px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #34d399; }
      .badge-def { font: 500 10.5px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #9ba1b4; }
      .badge-auto { font: 500 10.5px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #c4b5fd; }
      .pill-on { fill: #102b24; stroke: #256f58; stroke-width: 1; }
      .pill-off { fill: #1d202a; stroke: #2d3140; stroke-width: 1; }
      .txt-on { font: 500 11px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #6ee7b7; }
      .txt-off { font: 500 11px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #9ba1b4; }
      .lock-title { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #e9e4ff; }
      .lock-sub { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; fill: #b7b0d6; }
    </style>
  </defs>

  <rect class="bg" width="960" height="340" rx="14"/>

  <!-- Header -->
  <text x="28" y="34" class="title">Choose how much your agent handles — override any switch individually</text>
  <text x="28" y="53" class="subtitle">Every new workspace starts in Drafts only. Upgrade when you trust the workflow.</text>

  <!-- Card 1: Drafts only -->
  <g transform="translate(28, 72)">
    <rect class="card" width="286" height="176" rx="10"/>
    <text x="18" y="28" class="title">1. Drafts only</text>
    <rect x="206" y="13" width="62" height="20" rx="10" fill="#1e212b"/>
    <text x="237" y="27" text-anchor="middle" class="badge-def">Default</text>
    <text x="18" y="49" class="muted">Agent preps everything; you click send.</text>

    <rect class="pill-off" x="18" y="66" width="250" height="22" rx="6"/>
    <text x="28" y="81" class="txt-off">ATS portals — Prepare packet for review</text>

    <rect class="pill-off" x="18" y="94" width="250" height="22" rx="6"/>
    <text x="28" y="109" class="txt-off">Cold outreach — Save Gmail draft</text>

    <rect class="pill-off" x="18" y="122" width="250" height="22" rx="6"/>
    <text x="28" y="137" class="txt-off">Recruiter replies — Save Gmail draft</text>

    <rect class="pill-off" x="18" y="150" width="250" height="18" rx="5"/>
    <text x="28" y="163" class="txt-off">Inbox receipts — Leave untouched</text>
  </g>

  <!-- Card 2: Assisted (Recommended) -->
  <g transform="translate(337, 72)">
    <rect class="card-rec" width="286" height="176" rx="10"/>
    <text x="18" y="28" class="title">2. Assisted</text>
    <rect x="174" y="13" width="94" height="20" rx="10" fill="#0f2c23" stroke="#256f58" stroke-width="1"/>
    <text x="221" y="27" text-anchor="middle" class="badge-rec">Recommended</text>
    <text x="18" y="49" class="muted">Auto-applies clean forms; keeps mail human.</text>

    <rect class="pill-on" x="18" y="66" width="250" height="22" rx="6"/>
    <text x="28" y="81" class="txt-on">ATS portals — Auto-submit within daily cap</text>

    <rect class="pill-off" x="18" y="94" width="250" height="22" rx="6"/>
    <text x="28" y="109" class="txt-off">Cold outreach — Save Gmail draft</text>

    <rect class="pill-off" x="18" y="122" width="250" height="22" rx="6"/>
    <text x="28" y="137" class="txt-off">Recruiter replies — Save Gmail draft</text>

    <rect class="pill-on" x="18" y="150" width="250" height="18" rx="5"/>
    <text x="28" y="163" class="txt-on">Inbox receipts — Archive after logging</text>
  </g>

  <!-- Card 3: Autonomous -->
  <g transform="translate(646, 72)">
    <rect class="card" width="286" height="176" rx="10"/>
    <text x="18" y="28" class="title">3. Autonomous</text>
    <rect x="206" y="13" width="62" height="20" rx="10" fill="#221d33"/>
    <text x="237" y="27" text-anchor="middle" class="badge-auto">Opt-in</text>
    <text x="18" y="49" class="muted">Full execution inside verified guards.</text>

    <rect class="pill-on" x="18" y="66" width="250" height="22" rx="6"/>
    <text x="28" y="81" class="txt-on">ATS portals — Auto-submit within daily cap</text>

    <rect class="pill-on" x="18" y="94" width="250" height="22" rx="6"/>
    <text x="28" y="109" class="txt-on">Cold outreach — Send after zero-Sent check</text>

    <rect class="pill-on" x="18" y="122" width="250" height="22" rx="6"/>
    <text x="28" y="137" class="txt-on">Recruiter replies — Routine threads only</text>

    <rect class="pill-on" x="18" y="150" width="250" height="18" rx="5"/>
    <text x="28" y="163" class="txt-on">Inbox receipts — Archive after logging</text>
  </g>

  <!-- Always Human Boundary Bar -->
  <g transform="translate(28, 266)">
    <rect class="bar-safe" width="904" height="52" rx="10"/>
    <circle cx="24" cy="26" r="6" fill="#a78bfa"/>
    <text x="42" y="23" class="lock-title">Always human-confirmed in every mode</text>
    <text x="42" y="41" class="lock-sub">Booking interview slots   |   Live interviews &amp; offers   |   CAPTCHAs   |   1-use ephemeral secrets (0600, auto-shredded, never in chat or Git)</text>
  </g>
</svg>
