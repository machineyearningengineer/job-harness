<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" height="286" role="img" aria-label="Delegation modes matrix comparing Drafts only, Assisted, and Autonomous across external actions">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="285" rx="8" fill="#0d0e11" stroke="#23242b" stroke-width="1"/>

  <!-- Subtle column highlight for Recommended (Assisted) -->
  <rect x="526" y="1" width="212" height="236" fill="#14161c"/>

  <!-- Table header -->
  <text x="28" y="34" class="sans" font-size="13" font-weight="600" fill="#f1f1f4" letter-spacing="-0.01em">Delegation modes</text>
  <text x="342" y="34" class="sans" font-size="12" font-weight="600" fill="#d4d4dc">Drafts only</text>
  <text x="415" y="34" class="mono" font-size="10" fill="#6f717a">DEFAULT</text>

  <text x="546" y="34" class="sans" font-size="12" font-weight="600" fill="#f1f1f4">Assisted</text>
  <text x="604" y="34" class="mono" font-size="10" fill="#34d399">RECOMMENDED</text>

  <text x="760" y="34" class="sans" font-size="12" font-weight="600" fill="#d4d4dc">Autonomous</text>
  <text x="841" y="34" class="mono" font-size="10" fill="#6f717a">OPT-IN</text>

  <line x1="28" y1="50" x2="932" y2="50" stroke="#23242b" stroke-width="1"/>

  <!-- Row 1: Scout, dedupe & prep packets -->
  <text x="28" y="79" class="sans" font-size="12" fill="#c8c9d0">Scout, vet, freeze CV packets &amp; briefs</text>
  <text x="342" y="79" class="mono" font-size="11.5" fill="#9a9ca6">Auto</text>
  <text x="546" y="79" class="mono" font-size="11.5" fill="#34d399">Auto</text>
  <text x="760" y="79" class="mono" font-size="11.5" fill="#9a9ca6">Auto</text>
  <line x1="28" y1="95" x2="932" y2="95" stroke="#1a1c22" stroke-width="1"/>

  <!-- Row 2: Clean ATS portal submissions -->
  <text x="28" y="122" class="sans" font-size="12" fill="#c8c9d0">Submit clean ATS portals (within daily cap)</text>
  <text x="342" y="122" class="mono" font-size="11.5" fill="#6f717a">You submit</text>
  <text x="546" y="122" class="mono" font-size="11.5" fill="#34d399">Auto (capped)</text>
  <text x="760" y="122" class="mono" font-size="11.5" fill="#d4d4dc">Auto (capped)</text>
  <line x1="28" y1="138" x2="932" y2="138" stroke="#1a1c22" stroke-width="1"/>

  <!-- Row 3: Archive verified receipts & rejections -->
  <text x="28" y="165" class="sans" font-size="12" fill="#c8c9d0">Archive verified receipts &amp; closed mail</text>
  <text x="342" y="165" class="mono" font-size="11.5" fill="#6f717a">Plan only</text>
  <text x="546" y="165" class="mono" font-size="11.5" fill="#34d399">Auto</text>
  <text x="760" y="165" class="mono" font-size="11.5" fill="#d4d4dc">Auto</text>
  <line x1="28" y1="181" x2="932" y2="181" stroke="#1a1c22" stroke-width="1"/>

  <!-- Row 4: Cold emails & recruiter replies -->
  <text x="28" y="208" class="sans" font-size="12" fill="#c8c9d0">Cold outreach &amp; recruiter replies</text>
  <text x="342" y="208" class="mono" font-size="11.5" fill="#6f717a">Gmail draft</text>
  <text x="546" y="208" class="mono" font-size="11.5" fill="#d4d4dc">Gmail draft</text>
  <text x="760" y="208" class="mono" font-size="11.5" fill="#facc15">Auto (Sent-checked)</text>

  <!-- Always-human floor -->
  <line x1="28" y1="237" x2="932" y2="237" stroke="#23242b" stroke-width="1"/>
  <text x="28" y="264" class="sans" font-size="11.5" fill="#8b8d98">
    <tspan fill="#f1f1f4" font-weight="600">Always human across every mode:</tspan> booking calendar slots · interviews · offers &amp; negotiation · CAPTCHAs &amp; 1-use logins
  </text>
</svg>
