name: Release native binaries & desktop app
# Owner explicitly triggers a release build from a pinned version tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.4.0)
        type: string
        required: true
      confirm_full_release:
        description: Build/test all native targets and publish GitHub Release with checksums
        type: boolean
        required: true
        default: false
      prerelease:
        description: Mark release as prerelease
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
defaults:
  run:
    shell: bash
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CONFIRMED: ${{ inputs.confirm_full_release }}
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      # Fail loudly: a skipped run looks like a release that silently never happened.
      - name: Require explicit confirmation
        run: |
          if [ "$CONFIRMED" != true ]; then
            printf '%s\n' 'confirm_full_release was not ticked; nothing was built. Re-run with confirm_full_release=true.' >&2
            exit 1
          fi
      - name: Validate an existing version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Use an existing version tag that matches the package version.' >&2
            exit 1
          fi
      - name: Refuse an existing release before native builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_owner=${GH_REPO%%/*}
          release_name=${GH_REPO#*/}
          release_lookup=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { tagName } } }' \
            -f owner="$release_owner" -f name="$release_name" -f tag="$RELEASE_TAG")
          if ! jq -e '(has("errors") | not) and (.data.repository | has("release"))' <<< "$release_lookup" > /dev/null; then
            printf '%s\n' 'Could not verify release lookup; no native builds will start.' >&2
            exit 1
          fi
          if ! jq -e '.data.repository.release == null' <<< "$release_lookup" > /dev/null; then
            printf '%s\n' 'This tag already has a release; no duplicate builds or asset replacement will start.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Resolve one immutable source identity
        id: identity
        run: |
          commit=$(git rev-parse --verify HEAD)
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$commit"
          test -z "$(git status --porcelain --untracked-files=normal)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    # Each platform validates and links three separate native components.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_SUFFIX: ${{ matrix.suffix || '' }}
    steps:
      - name: Validate a version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Use an existing version tag that matches the package version.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Verify the selected clean source
        run: |
          test "$(git rev-parse --verify HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Keep native Linux build space available
        if: runner.os == 'Linux'
        run: |
          # Hosted-runner SDKs unrelated to this Rust/WebKit build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Linux optional desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libfontconfig1-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          test "$(rustc +1.97.1 -vV | sed -n 's/^host: //p')" = "$RELEASE_TARGET"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            apps/desktop/target
            providers/local/native/target
          key: rust-release-native-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('Cargo.lock', 'apps/desktop/Cargo.lock', 'providers/local/native/Cargo.lock') }}
          restore-keys: |
            rust-release-native-${{ runner.os }}-${{ runner.arch }}-1.97.1-
            rust-release-${{ runner.os }}-${{ runner.arch }}-1.97.1-
            rust-ci-${{ runner.os }}-${{ runner.arch }}-1.97.1-
            rust-desktop-${{ runner.os }}-${{ runner.arch }}-1.97.1-
      - name: Retire unused restored build artifacts
        run: |
          rm -rf "target/$RELEASE_TARGET" "providers/local/native/target/$RELEASE_TARGET" "apps/desktop/target/$RELEASE_TARGET" \
            target/msrv target/wasm32-unknown-unknown \
            target/debug/incremental providers/local/native/target/debug/incremental apps/desktop/target/debug/incremental
      - name: Test and build this exact source
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.97.1 test --workspace --all-targets --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- repository
          cargo +1.97.1 run -p job-harness-dev --locked -- contracts --check
          cargo +1.97.1 build --release --bins --locked
      - name: Verify the copied core executable
        run: cargo +1.97.1 run -p job-harness-dev --locked -- package --binary "target/release/job-harness$RELEASE_SUFFIX"
      - name: Build optional native provider without runtimes or weights
        run: |
          cargo +1.97.1 test --manifest-path providers/local/native/Cargo.toml --locked
          cargo +1.97.1 build --release --manifest-path providers/local/native/Cargo.toml --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --component local --binary "providers/local/native/target/release/job-harness-local$RELEASE_SUFFIX"
      - name: Build the optional desktop application
        run: |
          cargo +1.97.1 test --manifest-path apps/desktop/Cargo.toml --locked
          cargo +1.97.1 build --release --manifest-path apps/desktop/Cargo.toml --locked
          cargo +1.97.1 run -p job-harness-dev --locked -- package --component desktop --binary "apps/desktop/target/release/job-harness-desktop$RELEASE_SUFFIX"
      - name: Package separate software components
        run: |
          cargo +1.97.1 fetch --locked
          cargo +1.97.1 fetch --locked --manifest-path providers/local/native/Cargo.toml
          cargo +1.97.1 fetch --locked --manifest-path apps/desktop/Cargo.toml
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component core --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "target/release/job-harness$RELEASE_SUFFIX" --output dist
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component local --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "providers/local/native/target/release/job-harness-local$RELEASE_SUFFIX" --output dist
          cargo +1.97.1 run -p job-harness-dev --locked -- release-stage --component desktop --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary "apps/desktop/target/release/job-harness-desktop$RELEASE_SUFFIX" --output dist
      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          VER="${RELEASE_TAG#v}"
          APP="dist/Job Harness.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          install -m 755 "apps/desktop/target/release/job-harness-desktop" "$APP/Contents/MacOS/job-harness-desktop"
          if [ -f "apps/desktop/icons/icon.icns" ]; then
            cp "apps/desktop/icons/icon.icns" "$APP/Contents/Resources/icon.icns"
          fi
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>Job Harness</string>
            <key>CFBundleExecutable</key><string>job-harness-desktop</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundleIdentifier</key><string>dev.jobharness.desktop</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Job Harness</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$APP"
          ZIP="Job-Harness-${RELEASE_TAG}-${RELEASE_TARGET}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$ZIP"
          (cd dist && shasum -a 256 "$ZIP" > "${ZIP}.sha256")
          rm -rf "$APP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')" = "$RELEASE_COMMIT"
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          PRE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.zip SHA256SUMS --verify-tag $PRE_FLAG --title "Job Harness $RELEASE_TAG" --notes-file "../docs/releases/$RELEASE_TAG.md"
