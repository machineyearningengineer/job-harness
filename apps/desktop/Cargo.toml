[package]
name = "job-harness-desktop"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Native GPUI desktop interface for Job Harness"

[workspace]

[dependencies]
gpui = "0.2.2"
job-harness-core = { path = "../../crates/harness-core" }
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
